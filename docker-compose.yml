version: '3'

services:

  db:
    image: mysql:5.7
    container_name: library-db

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: library_db

      MYSQL_USER: library_user
      MYSQL_PASSWORD: librarypass

    ports:
      - "6033:3306"

    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: library-pma

    links:
      - db

    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 1

    restart: always

    ports:
      - "8081:80"

volumes:
    dbdata: